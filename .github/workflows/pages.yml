# Builds the website and publishes it on GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_STATIC: '1'
      # While on mis662.github.io/pta-mumbai/ keep BASE_PATH "/pta-mumbai/".
      # When ptamumbai.com points to GitHub: set BASE_PATH to "/" and CUSTOM_DOMAIN to "ptamumbai.com".
      BASE_PATH: /pta-mumbai/
      CUSTOM_DOMAIN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
