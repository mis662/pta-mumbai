# Netlify settings for ptamumbai.com
[build]
  command = "npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---- API → Netlify Function ----
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# ---- Old WordPress URLs (keep Google links working) ----
[[redirects]]
  from = "/the-truth-about-paper-myths-vs-facts/"
